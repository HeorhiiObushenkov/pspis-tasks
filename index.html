<!DOCTYPE html>
<html lang="uk" data-theme="emerald">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семестровий Дашборд</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind + DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script>
        // Suppress Tailwind CDN production warning
        const originalWarn = console.warn;
        console.warn = function(...args) {
            if (typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com should not be used in production')) return;
            originalWarn.apply(console, args);
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-base-200 min-h-screen font-sans selection:bg-primary selection:text-primary-content">

    <div class="drawer lg:drawer-open">
        <input id="my-drawer-2" type="checkbox" class="drawer-toggle" />

        <!-- Main Content -->
        <div class="drawer-content flex flex-col">
            <!-- Navbar (Mobile Only Toggle + Branding) -->
            <div class="navbar bg-base-100/80 backdrop-blur-md sticky top-0 z-50 shadow-sm lg:hidden">
                <div class="flex-none">
                    <label for="my-drawer-2" class="btn btn-square btn-ghost">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </label>
                </div>
                <div class="flex-1">
                    <a href="#home" class="btn btn-ghost text-xl font-bold tracking-tight text-base-content">
                        ПЗПІз-25-1</a>
                </div>
                <div class="flex-none gap-2">
                    <!-- Mobile Theme Toggle -->
                    <label class="swap swap-rotate btn btn-ghost btn-circle theme-controller-mobile">
                        <input type="checkbox" class="theme-controller" />
                        <i data-lucide="sun" class="swap-on w-6 h-6"></i>
                        <i data-lucide="moon" class="swap-off w-6 h-6"></i>
                    </label>
                </div>
            </div>

            <!-- Page Content -->
            <div class="p-4 md:p-10 max-w-5xl mx-auto w-full" id="content-area">
                <!-- Widgets injected here -->
                <div class="space-y-6">
                    <div class="skeleton h-32 w-full rounded-2xl"></div>
                    <div class="skeleton h-64 w-full rounded-2xl"></div>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="drawer-side z-50">
            <label for="my-drawer-2" aria-label="close sidebar" class="drawer-overlay"></label>
            <aside id="sidebar-aside" class="bg-base-100 min-h-full w-80 p-4 border-r border-base-200 flex flex-col gap-4 transition-all duration-300">
                <!-- Desktop Header -->
                <div id="sidebar-header" class="hidden lg:flex items-center justify-between px-2 py-2 mb-2">
                    <a href="#home" class="hover:opacity-80 transition-opacity overflow-hidden whitespace-nowrap" id="sidebar-logo-link">
                        <span class="font-bold text-2xl tracking-tight text-base-content" id="sidebar-logo">ПЗПІз-25-1</span>
                    </a>
                    <button id="toggle-sidebar-btn" class="btn btn-ghost btn-sm btn-square">
                        <i data-lucide="panel-left-close" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- Nav -->
                <ul class="menu flex-1 gap-2 p-0" id="subject-nav">
                    <!-- Nav items injected here -->
                    <li><div class="skeleton h-12 w-full rounded-lg"></div></li>
                    <li><div class="skeleton h-12 w-full rounded-lg"></div></li>
                    <li><div class="skeleton h-12 w-full rounded-lg"></div></li>
                </ul>

                <!-- Mobile Settings Link (Only visible on small screens) -->
                <div class="lg:hidden mt-auto border-t border-base-200 pt-4">
                    <button onclick="settings_modal.showModal()" class="btn btn-ghost w-full justify-start gap-3">
                        <i data-lucide="settings" class="w-5 h-5 opacity-60"></i>
                        <span>Налаштування</span>
                    </button>
                </div>

                <!-- Desktop Settings & Theme -->
                <div class="hidden lg:flex flex-col gap-1 mt-auto border-t border-base-200 pt-4">
                    <button onclick="settings_modal.showModal()"
                        class="btn btn-ghost btn-sm justify-start gap-4 px-3 w-full group transition-all">
                        <div class="w-5 flex justify-center items-center">
                            <i data-lucide="settings" class="w-5 h-5 opacity-60 group-hover:opacity-100 transition-opacity"></i>
                        </div>
                        <span
                            class="settings-text text-sm font-medium opacity-60 group-hover:opacity-100 transition-opacity">Налаштування</span>
                    </button>

                    <label
                        class="btn btn-ghost btn-sm justify-start gap-4 px-3 w-full group transition-all cursor-pointer swap swap-rotate">
                        <input type="checkbox" class="theme-controller hidden" />

                        <!-- Sun Icon -->
                        <div class="w-5 flex justify-center items-center swap-on">
                            <i data-lucide="sun" class="w-5 h-5 opacity-60 group-hover:opacity-100 transition-opacity"></i>
                        </div>

                        <!-- Moon Icon -->
                        <div class="w-5 flex justify-center items-center swap-off">
                            <i data-lucide="moon" class="w-5 h-5 opacity-60 group-hover:opacity-100 transition-opacity"></i>
                        </div>

                        <span class="theme-text text-sm font-medium opacity-60 group-hover:opacity-100 transition-opacity"
                            style="margin-left: 2.2rem;">Тема</span>
                    </label>
                </div>
        </div>
    </div>
    </aside>
    </div>
    </div>

    <!-- Settings Modal -->
    <dialog id="settings_modal" class="modal modal-bottom sm:modal-middle">
        <div class="modal-box bg-base-100 border border-base-200 shadow-2xl">
            <h3 class="font-bold text-2xl mb-6">Налаштування</h3>

            <div class="space-y-6">
                <!-- Theme Selection -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="form-control w-full">
                        <label class="label">
                            <span class="label-text font-semibold">Світла тема</span>
                        </label>
                        <select id="light-theme-picker" class="select w-full">
                            <!-- Themes injected here -->
                        </select>
                    </div>
                    <div class="form-control w-full">
                        <label class="label">
                            <span class="label-text font-semibold">Темна тема</span>
                        </label>
                        <select id="dark-theme-picker" class="select w-full">
                            <!-- Themes injected here -->
                        </select>
                    </div>
                </div>

                <div class="divider"></div>

                <!-- Cache Management -->
                <div class="space-y-3">
                    <label class="label p-0">
                        <span class="label-text font-semibold">Керування даними</span>
                    </label>
                    <div class="bg-base-200 p-4 rounded-xl flex items-center justify-between gap-4">
                        <div>
                            <p class="font-medium text-sm">Очистити кеш</p>
                            <p class="text-xs opacity-50">Видалить тимчасово завантажені дані дисциплін</p>
                        </div>
                        <button id="clear-cache-btn" class="btn btn-warning btn-sm">Очистити</button>
                    </div>
                </div>
            </div>

            <div class="modal-action mt-8">
                <form method="dialog">
                    <button class="btn btn-primary px-8">Готово</button>
                </form>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop bg-base-content/20 backdrop-blur-sm">
            <button>close</button>
        </form>
    </dialog>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="js/main.js"></script>
    <script>
        // Init static icons on load
        if (window.lucide) window.lucide.createIcons();
    </script>
</body>

</html>
